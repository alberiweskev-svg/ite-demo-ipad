name: ITE 4.0 contract settlement TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-contract-settlement-40.js'
      - 'test-contract-settlement-40.js'
      - 'ite-quotes-40.js'
      - 'ite-invoice-ledger-40.js'
      - '.github/workflows/contract-settlement-40.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-contract-settlement-40.js
      - run: node --check test-contract-settlement-40.js
      - run: node test-contract-settlement-40.js
      - run: node test-quote-invoice-bridge-40.js
