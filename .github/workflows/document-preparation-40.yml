name: ITE 4.0 document preparation regressions
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-document-preparation-40.js'
      - 'test-document-preparation-40.js'
      - 'ite-technical-dossier-40.js'
      - 'test-technical-dossier-40.js'
      - '.github/workflows/document-preparation-40.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-document-preparation-40.js
      - run: node test-document-preparation-40.js
      - run: node test-technical-dossier-40.js
