name: ITE 4.0.198 operational dossier TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operational-dossier-198.js'
      - 'ite-operational-dossier-ui-198.js'
      - 'tests/test-operational-dossier-198.js'
      - 'index.html'
      - '.github/workflows/operational-dossier-198.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Europe/Rome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Operational dossier synthetic tests
        env:
          TZ: ${{ matrix.timezone }}
        run: node tests/test-operational-dossier-198.js
      - name: Verify demo scripts
        run: |
          grep -q 'ite-operational-dossier-198.js' index.html
          grep -q 'ite-operational-dossier-ui-198.js' index.html
