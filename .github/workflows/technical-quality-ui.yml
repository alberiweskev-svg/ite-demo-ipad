name: Technical quality UI regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-technical-quality*', 'ite-technical-register.js', 'index.html', '.github/workflows/technical-quality-ui.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-technical-quality-ui.js
