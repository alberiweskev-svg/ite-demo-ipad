name: ITE 4.0 workorder gateway regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-workorder-ledger.js'
      - 'ite-workorder-gateway.js'
      - 'test-workorder-ledger.js'
      - 'test-workorder-gateway.js'
      - '.github/workflows/ite-workorder-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-workorder-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-workorder-ledger.js
      - run: node test-workorder-gateway.js
