name: Document intake 4.0.90
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-document-intake-90.js'
      - 'test-document-intake-90.js'
      - '.github/workflows/document-intake-90.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-document-intake-90.js
      - run: node --check test-document-intake-90.js
      - run: node test-document-intake-90.js
