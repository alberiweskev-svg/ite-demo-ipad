name: ITE 4.0 regression tests
on:
  push:
    branches:
      - sviluppo-4.0.0-base
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify vault JavaScript syntax
        run: node --check vault.js
      - name: Test encrypted vault migration without redundant IndexedDB writes
        run: node dev/test_400_vault_migration.cjs
      - name: Test exclusive vault session lock and fail-closed unsupported browsers
        run: node dev/test_400_vault_session_lock.cjs
      - name: Test vault IndexedDB connection cleanup on pagehide
        run: node dev/test_400_vault_pagehide.cjs
      - name: Test invoice text parser (synthetic data only)
        run: node tests/invoice-text-parser.test.js
      - name: Test backup
        run: node dev/test_400_backup.cjs
      - name: Test complete backup attachment integrity
        run: node dev/test_400_attachment_backup_integrity.cjs
      - name: Test accounting original SHA-256 before full backup and restore
        run: node dev/test_400_commerce_backup_originals.cjs
      - name: Test record deletion with attached documents
        run: node dev/test_400_core_delete_attachments.cjs
      - name: Test core-only import safety (synthetic backups)
        run: node dev/test_400_core_import.cjs
      - name: Test persistence
        run: node dev/test_400_persist.cjs
      - name: Test posted accounting documents remain immutable
        run: node dev/test_400_posted_documents.cjs
      - name: Test integrated financial settlements and TD04 credit notes (synthetic)
        run: |
          node --check ite-financial-desk.js
          node dev/test_400_financial_desk.cjs
      - name: Test invoice attribution to approved quotes, partial extras and SAL (synthetic)
        run: |
          node --check ite-contract-billing.js
          node dev/test_400_contract_billing.cjs
      - name: Test job material usage, audited stock, reversals and client isolation (synthetic)
        run: |
          node --check ite-job-materials.js
          node dev/test_400_job_materials.cjs
      - name: Test integrated site material costing and approved supply allocation (synthetic)
        run: |
          node --check ite-site-costing.js
          node dev/test_400_site_costing.cjs
      - name: Test integrated labor, expenses, internal rates and audit (synthetic)
        run: |
          node --check ite-job-economics.js
          node dev/test_400_job_economics.cjs
      - name: Test integrated worksite financial and cost reconciliation (synthetic)
        run: |
          node --check ite-site-reconciliation.js
          node dev/test_400_site_reconciliation.cjs
      - name: Test warehouse stock and references
        run: node dev/test_400_warehouse.cjs
      - name: Test itemized quotes and supply/install separation
        run: node dev/test_400_quotes.cjs
      - name: Test integrated Di.Co. Di.Ri. GAS POS technical drafts and intervention prefill
        run: node dev/test_400_technical_drafts.cjs
      - name: Test POS navigation and technical completeness assessment
        run: node dev/test_400_technical_review.cjs
      - name: Test operational POS registers and legacy text preservation
        run: |
          node --check pos-operativo.js
          node dev/test_400_pos_registers.cjs
      - name: Test technical field readings, equipment history, reversals and dossier (synthetic)
        run: |
          node --check ite-field-checks.js
          node dev/test_400_field_checks.cjs
          node dev/test_400_field_dossier.cjs
      - name: Test technical consistency across customer, annex, proofs, CAD and safe prefill
        run: |
          node --check ite-technical-consistency.js
          node dev/test_400_technical_consistency.cjs
      - name: Test technical evidence provenance, revision, audit, revocation and export
        run: |
          node --check ite-technical-evidence.js
          node dev/test_400_technical_evidence.cjs
      - name: Test intervention dossier, hierarchy, time, materials, A4 and CSV
        run: |
          node --check ite-intervention-dossier.js
          node dev/test_400_intervention_dossier.cjs
      - name: Test POS cross-register audit, A4 and CSV (synthetic)
        run: |
          node --check pos-audit.js
          node dev/test_400_pos_audit.cjs
      - name: Test integrated CAD geometry, references and revision validation
        run: |
          node --check ite-cad.js
          node dev/test_400_cad.cjs
          node dev/test_400_cad_advanced.cjs
          node dev/test_400_cad_transform.cjs
          node dev/test_400_cad_snap.cjs
          node dev/test_400_cad_layers.cjs
          node dev/test_400_cad_catalog.cjs
          node --check ite-cad-workflow.js
          node dev/test_400_cad_workflow.cjs
      - name: Test technical crosscheck of CAD, equipment and intervention (synthetic)
        run: node dev/test_400_technical_sources.cjs
      - name: Test technical dossier, filters and revision comparisons
        run: node dev/test_400_technical_dossier.cjs
      - name: Test technical PDF bytes, privacy, pagination and client isolation
        run: |
          node --check technical-pdf.js
          node dev/test_400_technical_pdf.cjs
      - name: Test editable AcroForm technical PDFs for all eight practice types
        run: |
          node --check technical-acroform.js
          node dev/test_400_acroform.cjs
          node dev/test_400_acroform_pdfjs.mjs
      - name: Test structured A4 technical dossiers, provenance and annex isolation
        run: |
          node --check technical-structured-docs.js
          node dev/test_400_structured_docs.cjs
      - name: Test cross-practice technical completion plan (synthetic)
        run: node dev/test_400_dossier_plan.cjs
      - name: Test SHA-256 verified technical original ZIP package (synthetic only)
        run: node dev/test_400_original_bundle.cjs
      - name: Test worksite labor and financial summaries
        run: node dev/test_400_worksite.cjs
      - name: Test linked document and worksite view refresh
        run: node dev/test_400_linked_views.cjs
      - name: Test archive recovery
        run: node dev/test_400_archive_recovery.cjs
      - name: Test concurrent tabs archive freshness
        run: node dev/test_400_cross_tab_core.cjs
      - name: Test integrated maintenance planning and safe CSV (synthetic)
        run: |
          node --check ite-maintenance-planner.js
          node dev/test_400_maintenance_planner.cjs
      - name: Test appointment validation
        run: node dev/test_400_appointments.cjs
      - name: Test employee calendar colors
        run: node dev/test_400_staff_colors.cjs
      - name: Test operator contact references
        run: node dev/test_400_operator_links.cjs
      - name: Test operator hours
        run: node dev/test_400_operator_hours.cjs
      - name: Test intervention closure, revision and audited time correction
        run: node dev/test_400_interventions.cjs
      - name: Test revision hours
        run: node dev/test_400_revision_hours.cjs
      - name: Test revision audit
        run: node dev/test_400_revision_audit.cjs
      - name: Test revision attachments
        run: node dev/test_400_revision_attachments.cjs
      - name: Test immutable historical intervention attachments
        run: node dev/test_400_document_retention.cjs
      - name: Test saved attachment metadata and bytes
        run: node dev/test_400_document_save_integrity.cjs
      - name: Test accounting import file completeness and safe parser fallback
        run: node dev/test_400_import_file_integrity.cjs
      - name: Test accounting original integrity before reopening
        run: node dev/test_400_import_original_integrity.cjs
      - name: Test accounting import queue original integrity before persistence
        run: node dev/test_400_import_queue_integrity.cjs
      - name: Test ZIP input completeness before decompression
        run: node dev/test_400_zip_import_integrity.cjs
      - name: Test document preview integrity
        run: node dev/test_400_document_preview_integrity.cjs
      - name: Test backup download link lifecycle
        run: node dev/test_400_backup_download.cjs
      - name: Prepare standalone 4.0 preview with verified script integrity
        run: |
          node dev/sync_sri.cjs --write
          node dev/sync_sri.cjs
          mkdir -p "$RUNNER_TEMP/ite-4-preview"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/ite-4-preview"
          cp vault.js index.html "$RUNNER_TEMP/ite-4-preview/"
          rm -rf "$RUNNER_TEMP/ite-4-preview/.github" "$RUNNER_TEMP/ite-4-preview/dev"
      - name: Verify Windows PDF.js module MIME for local preview
        run: node dev/test_400_preview_mime.cjs
      - name: Check preview HTML and essential files
        run: |
          test -s "$RUNNER_TEMP/ite-4-preview/index.html"
          test -s "$RUNNER_TEMP/ite-4-preview/app.js"
          test -s "$RUNNER_TEMP/ite-4-preview/technical-pdf.js"
          test -s "$RUNNER_TEMP/ite-4-preview/technical-acroform.js"
          test -s "$RUNNER_TEMP/ite-4-preview/technical-structured-docs.js"
          test -s "$RUNNER_TEMP/ite-4-preview/pos-operativo.js"
          test -s "$RUNNER_TEMP/ite-4-preview/pos-audit.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-field-checks.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-technical-evidence.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-intervention-dossier.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-cad.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-cad-workflow.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-maintenance-planner.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-financial-desk.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-contract-billing.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-job-materials.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-site-costing.js"
          test -s "$RUNNER_TEMP/ite-4-preview/ite-site-reconciliation.js"
          test -s "$RUNNER_TEMP/ite-4-preview/vault.js"
          test -s "$RUNNER_TEMP/ite-4-preview/version.json"
          test -s "$RUNNER_TEMP/ite-4-preview/AVVIA_ANTEPRIMA_WINDOWS.bat"
          test -s "$RUNNER_TEMP/ite-4-preview/AVVIA_ANTEPRIMA_WINDOWS.ps1"
          grep -q '127.0.0.1:8765' "$RUNNER_TEMP/ite-4-preview/AVVIA_ANTEPRIMA_WINDOWS.ps1"
          node --check "$RUNNER_TEMP/ite-4-preview/app.js"
          node --check "$RUNNER_TEMP/ite-4-preview/vault.js"
          if grep -q '<script src="./vault.js?v=4.0.0"' "$RUNNER_TEMP/ite-4-preview/index.html"; then
            echo "Preview HTML includes vault loader"
          else
            echo "Missing vault loader in preview" >&2
            exit 1
          fi
      - name: Install Chromium and WebKit browser smoke-test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Chromium integrated field measurements, dossier and audit (synthetic)
        run: node dev/test_400_field_checks_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit integrated field measurements, dossier and audit (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_field_checks_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium technical evidence links in Di.Co. (synthetic)
        run: node dev/test_400_technical_evidence_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit technical evidence links in Di.Co. (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_technical_evidence_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium technical source consistency and guided prefill (synthetic)
        run: node dev/test_400_technical_consistency_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit technical source consistency and guided prefill (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_technical_consistency_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium intervention dossier A4 and CSV (synthetic)
        run: node dev/test_400_intervention_dossier_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit intervention dossier A4 and CSV (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_intervention_dossier_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium POS cross-register audit and exports (synthetic)
        run: node dev/test_400_pos_audit_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit POS cross-register audit and exports (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_pos_audit_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium integrated CAD drawing, backup and SVG (synthetic)
        run: node dev/test_400_cad_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit integrated CAD drawing, backup and SVG (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_cad_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium CAD to worksite quote with synthetic data
        run: node dev/test_400_cad_workflow_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit CAD to worksite quote with synthetic data
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_cad_workflow_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium crosscheck of technical practice and CAD materials (synthetic)
        run: node dev/test_400_technical_sources_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit crosscheck of technical practice and CAD materials (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_technical_sources_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium integrated technical draft browser flow with synthetic data
        run: node dev/test_400_technical_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit integrated technical draft save, backup, revision and print
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_technical_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium technical PDF download (synthetic data)
        run: node dev/test_400_technical_pdf_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit technical PDF download (synthetic data)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_technical_pdf_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium structured A4 dossier and annex index (synthetic)
        run: node dev/test_400_structured_docs_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit structured A4 dossier and annex index (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_structured_docs_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium integrated maintenance planner, CSV and calendar (synthetic)
        run: node dev/test_400_maintenance_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit integrated maintenance planner, CSV and calendar (synthetic)
        env:
          ITE_BROWSER: webkit
        run: node dev/test_400_maintenance_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium worksite quote/extra to invoice allocation and reversal (synthetic)
        run: node dev/test_400_contract_billing_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit worksite quote/extra to invoice allocation and reversal (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_contract_billing_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium job material stock, reversal and worksite (synthetic)
        run: node dev/test_400_job_materials_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit job material stock, reversal and worksite (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_job_materials_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium worksite material costing and approved supply (synthetic)
        run: node dev/test_400_site_costing_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit worksite material costing and approved supply (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_site_costing_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium integrated worksite reconciliation (synthetic)
        run: node dev/test_400_site_reconciliation_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit integrated worksite reconciliation (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_site_reconciliation_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium worksite labor and expenses (synthetic)
        run: node dev/test_400_job_economics_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit worksite labor and expenses (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_job_economics_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Chromium smoke test of encrypted vault and tablet layout
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit smoke test of encrypted vault and tablet layout (Safari engine)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit attachment and camera persistence after tab close/reopen (required)
        env:
          ITE_TEST_BROWSER: webkit
          ITE_TEST_WEBKIT_CAMERA_FULL: '2'
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Diagnostic WebKit direct reload after intervention revision, before attachments
        id: webkit_before_photos
        continue-on-error: true
        env:
          ITE_TEST_BROWSER: webkit
          ITE_TEST_WEBKIT_CAMERA_FULL: '4'
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Diagnostic WebKit camera upload and encrypted reload (known crash, not a passing gate)
        id: webkit_reload
        continue-on-error: true
        env:
          ITE_TEST_BROWSER: webkit
          ITE_TEST_WEBKIT_CAMERA_FULL: '1'
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Diagnostic WebKit same-tab navigation after photos (compare with reload crash)
        id: webkit_same_tab
        continue-on-error: true
        env:
          ITE_TEST_BROWSER: webkit
          ITE_TEST_WEBKIT_CAMERA_FULL: '3'
        run: node dev/test_400_browser_smoke.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Report WebKit diagnostic outcomes separately from required tests
        if: always()
        run: |
          echo "### WebKit photo navigation diagnostics (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Before attachments: ${{ steps.webkit_before_photos.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct reload: ${{ steps.webkit_reload.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Same-tab navigation: ${{ steps.webkit_same_tab.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "These diagnostics are not passing gates; a successful regression does not mean they passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Chromium manual invoice and TD04 settlement (synthetic)
        run: node dev/test_400_financial_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: WebKit manual invoice and TD04 settlement (synthetic)
        env:
          ITE_TEST_BROWSER: webkit
        run: node dev/test_400_financial_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Browser accounting import, backup and encrypted reopen (synthetic invoice)
        run: node dev/test_400_accounting_browser.cjs "$RUNNER_TEMP/ite-4-preview"
      - name: Upload tested development preview
        uses: actions/upload-artifact@v4
        with:
          name: ITE-4-development-preview
          path: ${{ runner.temp }}/ite-4-preview/
          if-no-files-found: error
          retention-days: 14
