name: ITE 4.0.137 tabular import regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-table-import-137.js
      - run: node --check ite-table-import-ui-137.js
      - run: node --check ite-document-intake-ui-114.js
      - run: node test-table-import-137.js
      - run: node test-batch-136.js
