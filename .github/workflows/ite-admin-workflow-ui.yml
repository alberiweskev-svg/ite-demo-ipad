name: ITE 4.0 administrative workflow UI
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-administrative-*.js'
      - 'test-administrative-workflow-ui.js'
      - '.github/workflows/ite-admin-workflow-ui.yml'
  workflow_dispatch:
jobs:
  administrative-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-administrative-desk-ui.js
      - run: node test-administrative-workflow-ui.js
