name: ITE 4.0.156 material planning TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-inventory-154.js && node --check ite-material-planning-156.js
      - run: node test-inventory-154.js && node test-material-planning-156.js
