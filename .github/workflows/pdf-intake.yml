name: Synthetic technical intake checks
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-pdf-intake.js'
      - 'test-pdf-intake.js'
      - 'ite-technical-demo-ui.js'
      - 'ite-technical-register.js'
      - 'index.html'
      - '.github/workflows/pdf-intake.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-pdf-intake.js
      - run: node --check ite-technical-demo-ui.js
      - run: node test-technical-register.js
      - run: node test-pdf-intake.js
      - run: node test-technical-demo-integration.js
      - run: node -e "const fs=require('fs'),h=fs.readFileSync('index.html','utf8');if(!(h.indexOf('ite-pdf-intake.js')<h.indexOf('ite-technical-demo-ui.js')&&h.includes('ite-pdf-intake.js')))process.exit(1)"
