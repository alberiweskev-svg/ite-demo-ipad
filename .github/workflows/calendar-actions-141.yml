name: Calendar actions 4.0.141 TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  calendar-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-calendar-actions-141.js && node --check ite-calendar-actions-ui-141.js && node --check ite-document-intake-ui-114.js
      - run: node test-calendar-actions-141.js
      - run: node test-calendar-140.js
