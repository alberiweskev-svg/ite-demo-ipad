name: ITE 4.0.267 commercial workflow
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-commercial-workflow-267.js','test-commercial-workflow-267.js','.github/workflows/ite-4-267-commercial.yml']
  workflow_dispatch:
jobs:
  commercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-commercial-workflow-267.js
      - run: node test-commercial-workflow-267.js
