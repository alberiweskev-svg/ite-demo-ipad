name: Document workspace 4.0.91
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-document-intake-90.js
      - run: node --check ite-document-workspace-91.js
      - run: node test-document-workspace-91.js
