name: ITE 4.0 TEST contract control
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-contract-control-40.js', 'ite-contract-control-ui-40.js', 'test-contract-control-40.js', 'ite-contract-settlement-40.js', 'ite-quotes-40.js', 'ite-invoice-ledger-40.js', '.github/workflows/contract-control-40.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-contract-control-40.js
      - run: node --check ite-contract-control-ui-40.js
