name: ITE 4.0 technical registry TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-registry-40.js'
      - 'test-technical-registry-40.js'
      - 'ite-operations-40.js'
      - '.github/workflows/technical-registry-40.yml'
  workflow_dispatch:
jobs:
  technical-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-technical-registry-40.js
      - run: node --check test-technical-registry-40.js
      - run: node test-technical-registry-40.js
