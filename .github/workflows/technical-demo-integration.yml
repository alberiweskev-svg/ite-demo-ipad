name: Technical register integrated checks
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-register.js'
      - 'ite-technical-demo-ui.js'
      - 'test-technical-register.js'
      - 'test-technical-demo-integration.js'
      - 'index.html'
      - '.github/workflows/technical-demo-integration.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-technical-register.js
      - run: node test-technical-demo-integration.js
