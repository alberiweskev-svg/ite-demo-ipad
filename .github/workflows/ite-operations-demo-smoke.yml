name: ITE operations demo smoke
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operations-demo.html'
      - 'ite-operations-demo.js'
      - 'ite-operations-demo.css'
      - 'ite-service-lifecycle.js'
      - 'ite-operations-workspace.js'
      - '.github/workflows/ite-operations-demo-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-operations-demo.js
      - run: node --check ite-service-lifecycle.js
      - run: node --check ite-operations-workspace.js
      - run: node --test tests/appointment-cancellation.test.cjs tests/appointment-rescheduling.test.cjs tests/lifecycle-audit-id-regression.test.cjs
