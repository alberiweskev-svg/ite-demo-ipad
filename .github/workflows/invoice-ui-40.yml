name: ITE 4.0.52 invoice TEST integration
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-invoice-ledger-40.js'
      - 'ite-invoice-ledger-ui-40.js'
      - 'test-invoice-ui-integration-40.js'
      - '.github/workflows/invoice-ui-40.yml'
  workflow_dispatch:
jobs:
  invoice-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-invoice-ledger-40.js
      - run: node --check ite-invoice-ledger-ui-40.js
      - run: node --check test-invoice-ui-integration-40.js
      - run: node test-invoice-ledger-40.js
      - run: node test-invoice-ui-integration-40.js
