name: ITE 4.0.127 quick calendar TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Booking regressions
        run: |
          node test-operations-123.js
          node test-audit-124.js
          node test-calendar-125.js
          node test-booking-126.js
          node test-quick-calendar-127.js
