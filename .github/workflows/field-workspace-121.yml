name: Field workspace 4.0.121
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-field-workspace-121.js'
      - 'ite-field-workspace-ui-121.js'
      - 'test-field-workspace-121.js'
      - 'ite-document-intake-ui-114.js'
      - '.github/workflows/field-workspace-121.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-field-workspace-121.js && node --check ite-field-workspace-ui-121.js && node --check ite-document-intake-ui-114.js
      - run: node test-field-workspace-121.js
