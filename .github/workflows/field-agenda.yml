name: ITE 4.0 Field Agenda
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-field-agenda.js', 'ite-field-workflow.js', 'test-field-agenda.js', '.github/workflows/field-agenda.yml']
  workflow_dispatch:
jobs:
  field-agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-field-agenda.js
