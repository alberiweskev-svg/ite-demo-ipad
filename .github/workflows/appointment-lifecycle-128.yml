name: ITE 4.0.128 appointment lifecycle TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-appointment-lifecycle-128.js && node --check ite-appointment-lifecycle-ui-128.js
      - run: node test-appointment-lifecycle-128.js
      - run: node test-quick-calendar-127.js
      - run: node test-booking-126.js
