name: ITE 4.0.118 PDF local bridge
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-document-pdf-bridge-118.js && node --check ite-document-pdf-bridge-ui-118.js
      - run: node test-pdf-local-reader.js
      - run: node test-document-batch-117.js
      - run: node test-document-pdf-bridge-118.js
