name: ITE 4.0.271 Technical Register
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-register-271.js'
      - 'ite-technical-register-ui-271.js'
      - 'test-technical-register-271.js'
      - '.github/workflows/ite-4-271-technical.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-technical-register-271.js
      - run: node test-dossier-270.js
