name: Technical workflow 4.0.221
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-register-ui-219.js'
      - 'ite-technical-workflow-220.js'
      - 'ite-document-intake-217.js'
      - 'ite-workspace-store-209.js'
      - 'tests/test-technical-flow-221.js'
      - '.github/workflows/technical-flow-221.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, Europe/Rome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Technical workflow regressions
        env:
          TZ: ${{ matrix.tz }}
        run: |
          node --check ite-technical-register-ui-219.js
          node tests/test-technical-workflow-220.js
          node tests/test-technical-flow-221.js
