name: ITE 4.0.276 integrated synthetic operations
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operations-276.js'
      - 'ite-operations-ui-276.js'
      - 'index.html'
      - 'tests/ite-operations-276.test.js'
      - '.github/workflows/ite-operations-276.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ite-operations-276.test.js tests/ite-atomic-closeout-275.test.js
