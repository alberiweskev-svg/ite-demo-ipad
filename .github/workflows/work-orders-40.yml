name: ITE 4.0.29 Work orders TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-work-orders-40.js'
      - 'tests/test-work-orders-40.js'
      - '.github/workflows/work-orders-40.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check ite-work-orders-40.js
          node --check tests/test-work-orders-40.js
      - name: Integrated work orders
        run: node tests/test-work-orders-40.js
      - name: Previous operational regressions
        run: |
          node tests/test-field-dashboard-40.js
          node tests/test-dispatch-40.js
