name: Build ITE 4.0 step 1
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'dev/apply_400_step1.py'
      - '.github/workflows/build-400.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI simplification and verify integrity
        run: python3 dev/apply_400_step1.py
      - name: Commit generated assets
        run: |
          git config user.name "ite-400-builder"
          git config user.email "ite-400-builder@users.noreply.github.com"
          git add app.js vault.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: 4.0.0 first archive simplification [skip ci]"
            git push
          fi
