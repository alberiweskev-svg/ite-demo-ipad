name: Validate and build ITE 4.0
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'dev/apply_400_step1.py'
      - 'dev/test_400_worksite.cjs'
      - 'dev/test_400_appointments.cjs'
      - 'dev/test_400_interventions.cjs'
      - 'dev/test_400_backup.cjs'
      - 'dev/test_400_core_import.cjs'
      - 'dev/test_400_warehouse.cjs'
      - 'dev/test_400_posted_documents.cjs'
      - 'dev/test_400_linked_views.cjs'
      - 'app.js'
      - 'ite-cad.js'
      - 'ite-cad-workflow.js'
      - 'technical-structured-docs.js'
      - 'technical-pdf.js'
      - 'technical-acroform.js'
      - 'dev/test_400_acroform.cjs'
      - 'dev/test_400_acroform_pdfjs.mjs'
      - 'dev/test_400_technical_pdf_browser.cjs'
      - 'dev/test_400_preview_mime.cjs'
      - 'AVVIA_ANTEPRIMA_WINDOWS.ps1'
      - 'dev/test_400_technical_pdf.cjs'
      - 'dev/test_400_structured_docs.cjs'
      - 'dev/test_400_structured_docs_browser.cjs'
      - 'dev/test_400_cad_workflow.cjs'
      - 'dev/test_400_cad_workflow_browser.cjs'
      - 'dev/test_400_technical_sources.cjs'
      - 'dev/test_400_technical_sources_browser.cjs'
      - 'dev/test_400_cad_catalog.cjs'
      - 'dev/test_400_cad_browser.cjs'
      - 'index.html'
      - 'vault.js'
      - '.github/workflows/build-400.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and rebuild integrity
        run: python3 dev/apply_400_step1.py
      - name: Worksite regression tests
        run: node dev/test_400_worksite.cjs
      - name: Appointment workflow regression tests
        run: node dev/test_400_appointments.cjs
      - name: Intervention audit regression tests
        run: node dev/test_400_interventions.cjs
      - name: Backup restore regression tests
        run: node dev/test_400_backup.cjs
      - name: Encrypted legacy import regression tests
        run: node dev/test_400_core_import.cjs
      - name: Warehouse stock regression tests
        run: node dev/test_400_warehouse.cjs
      - name: Posted stock document immutability tests
        run: node dev/test_400_posted_documents.cjs
      - name: Linked site and customer views tests
        run: node dev/test_400_linked_views.cjs
      - name: Editable technical PDF AcroForm regression
        run: |
          node --check technical-acroform.js
          node dev/test_400_acroform.cjs
          node dev/test_400_acroform_pdfjs.mjs
      - name: CAD catalog and metric drawing regression tests
        run: |
          node --check ite-cad.js
          node dev/test_400_cad.cjs
          node dev/test_400_cad_advanced.cjs
          node dev/test_400_cad_catalog.cjs
          node --check ite-cad-workflow.js
          node dev/test_400_cad_workflow.cjs
      - name: Technical crosscheck of CAD and interventions
        run: node dev/test_400_technical_sources.cjs
      - name: Structured technical dossier unit and syntax tests
        run: |
          node --check technical-structured-docs.js
          node dev/test_400_structured_docs.cjs
      - name: Contextual technical PDF validation and isolation tests
        run: |
          node --check technical-pdf.js
          node dev/test_400_technical_pdf.cjs
      - name: Verify generated script integrity without pushing
        run: |
          node dev/sync_sri.cjs --write
          node dev/sync_sri.cjs
          node --check app.js
          node --check vault.js
