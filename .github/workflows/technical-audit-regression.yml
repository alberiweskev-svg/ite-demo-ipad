name: ITE 4.0 technical document review regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-intake.js'
      - 'ite-technical-audit.js'
      - 'test-technical-intake.js'
      - 'test-technical-audit.js'
      - 'index.html'
      - '.github/workflows/technical-audit-regression.yml'
  workflow_dispatch:
jobs:
  technical-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-technical-intake.js && node --check ite-technical-audit.js
      - run: node test-technical-intake.js && node test-technical-audit.js
      - run: node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');if(!h.includes('ite-technical-intake.js')||!h.includes('ite-technical-audit.js'))process.exit(1)"
