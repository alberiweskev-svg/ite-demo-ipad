name: ITE 4.0.130 guided TEST regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-guided-130.js
      - run: node test-unified-129.js
