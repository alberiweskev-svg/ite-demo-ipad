name: ITE 4.0.161 Supplier CSV and delivery TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-supplier-import-160.js'
      - 'ite-supplier-import-ui-161.js'
      - 'ite-inventory-154.js'
      - 'index.html'
      - 'test-supplier-import-161.js'
      - '.github/workflows/supplier-import-161.yml'
  workflow_dispatch:
jobs:
  supplier-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-supplier-import-160.js
      - run: node --check ite-supplier-import-ui-161.js
      - run: node --check test-supplier-import-161.js
      - run: node test-supplier-import-160.js
      - run: node test-supplier-import-161.js
