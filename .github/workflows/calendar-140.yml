name: Calendar 4.0.140 TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-calendar-140.js && node --check ite-calendar-ui-140.js && node --check ite-document-intake-ui-114.js
      - run: node test-calendar-140.js
