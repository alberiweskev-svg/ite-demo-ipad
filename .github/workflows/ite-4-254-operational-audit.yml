name: ITE 4.0.254 operational audit
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['gestionale4/**', '.github/workflows/ite-4-254-operational-audit.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check gestionale4/operational-audit-254.js
      - run: node gestionale4/test-operational-audit-254.js
      - run: node gestionale4/test-planning-252.js
      - run: node gestionale4/test-dispatch-253.js
