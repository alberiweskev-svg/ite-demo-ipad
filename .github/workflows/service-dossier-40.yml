name: ITE 4.0.67 Service dossier TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-service-dossier-40.js'
      - 'ite-service-dossier-ui-40.js'
      - 'test-service-dossier-40.js'
      - 'index.html'
      - '.github/workflows/service-dossier-40.yml'
  workflow_dispatch:
jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-service-dossier-40.js
      - run: node --check ite-service-dossier-ui-40.js
      - run: node --check test-service-dossier-40.js
      - run: node test-service-dossier-40.js
