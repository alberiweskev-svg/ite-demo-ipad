name: ITE 4.0 operations workspace
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operations-40.js'
      - 'ite-operations-workspace-40.js'
      - 'test-operations-40.js'
      - 'test-operations-workspace-40.js'
      - '.github/workflows/operations-workspace-40.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-operations-40.js && node --check ite-operations-workspace-40.js
      - run: node test-operations-40.js
      - run: node test-operations-workspace-40.js
