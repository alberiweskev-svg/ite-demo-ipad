name: ITE 4.0.75 Finance Workspace TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-finance-reconcile-40.js'
      - 'ite-finance-workspace-40.js'
      - 'ite-finance-workspace-ui-40.js'
      - 'test-finance-workspace-40.js'
      - 'index.html'
      - '.github/workflows/finance-workspace-40.yml'
  workflow_dispatch:
jobs:
  finance-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check ite-finance-reconcile-40.js
          node --check ite-finance-workspace-40.js
          node --check ite-finance-workspace-ui-40.js
          node --check test-finance-workspace-40.js
          node test-finance-reconcile-40.js
          node test-finance-workspace-40.js
          node -e "const s=require('fs').readFileSync('index.html','utf8');for(const x of ['ite-finance-reconcile-40.js','ite-finance-workspace-40.js','ite-finance-workspace-ui-40.js'])if(!s.includes(x))throw Error(x+' not loaded');"
