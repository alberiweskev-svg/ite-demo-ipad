name: ITE 4.0.123 integrated operations
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  integrated-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Field, commercial and integrated regression
        run: |
          node test-field-workspace-121.js
          node test-commercial-122.js
          node test-operations-123.js
