name: ITE 4.0.268 commercial ledger tests
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-commercial-workflow-267.js'
      - 'ite-commercial-ledger-268.js'
      - 'ite-commercial-ledger-ui-268.js'
      - 'test-commercial-ledger-268.js'
      - '.github/workflows/ite-4-268-commercial.yml'
  workflow_dispatch:
jobs:
  commercial-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-commercial-ledger-268.js
      - run: node --check ite-commercial-ledger-ui-268.js
      - run: node test-commercial-ledger-268.js
