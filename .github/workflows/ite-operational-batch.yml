name: ITE 4.0 operational batch validation
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operational-batch.js'
      - 'ite-operational-transitions.js'
      - 'tests/operational-batch.test.cjs'
      - '.github/workflows/ite-operational-batch.yml'
  workflow_dispatch:
jobs:
  synthetic-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check ite-operational-batch.js && node --check ite-operational-transitions.js
      - name: Synthetic workflow validation
        run: node --test tests/operational-batch.test.cjs
