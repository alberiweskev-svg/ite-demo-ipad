name: ITE 4.0.283 Financial Controls TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audit commerciale
        run: node --test tests/ite-financial-controls-283.test.js
      - name: Controllo sintassi UI
        run: |
          node --check ite-financial-controls-283.js
          node --check ite-financial-controls-ui-283.js
