name: ITE 4.0 cumulative supplier settlement
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-procurement-*.js'
      - 'test-procurement-cumulative-*.js'
      - '.github/workflows/ite-cumulative-settlement.yml'
  workflow_dispatch:
jobs:
  settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic cumulative reconciliation regression
        run: |
          node test-procurement-cumulative-audit.js
          node test-procurement-cumulative-settlement.js
          node test-procurement-review-session.js
          node tests/ite-procurement-batch-integrity.test.js
