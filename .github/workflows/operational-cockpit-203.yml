name: Operational cockpit 4.0.203
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-workflow-cockpit-ui-203.js','ite-operational-workflow-201.js','ite-operational-batch-202.js','tests/test-workflow-cockpit-203.js','.github/workflows/operational-cockpit-203.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, Europe/Rome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: TZ=${{ matrix.tz }} node tests/test-operational-workflow-201.js
      - run: TZ=${{ matrix.tz }} node tests/test-operational-batch-202.js
      - run: TZ=${{ matrix.tz }} node tests/test-workflow-cockpit-203.js
