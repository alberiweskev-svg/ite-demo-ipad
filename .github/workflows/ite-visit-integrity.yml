name: ITE visit reference checks
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operations-integrity.js'
      - 'tests/visit-reference-integrity.test.cjs'
      - '.github/workflows/ite-visit-integrity.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-operations-integrity.js
      - run: node --test tests/visit-reference-integrity.test.cjs
