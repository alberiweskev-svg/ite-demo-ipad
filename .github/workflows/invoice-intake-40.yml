name: ITE 4.0.53 Invoice Intake TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-invoice-intake-40.js'
      - 'ite-invoice-intake-ui-40.js'
      - 'ite-invoice-ledger-40.js'
      - 'test-invoice-intake-40.js'
      - '.github/workflows/invoice-intake-40.yml'
  workflow_dispatch:
jobs:
  invoice-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-invoice-ledger-40.js
      - run: node test-invoice-intake-40.js
      - run: node --check ite-invoice-intake-ui-40.js
