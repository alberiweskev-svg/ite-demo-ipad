name: ITE 4.0 quote-invoice synchronization TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-quotes-40.js'
      - 'ite-quotes-ui-40.js'
      - 'ite-invoice-ledger-40.js'
      - 'ite-invoice-ledger-ui-40.js'
      - 'ite-quote-invoice-bridge-40.js'
      - 'ite-quote-invoice-bridge-ui-40.js'
      - 'test-quote-invoice-sync-40.js'
      - '.github/workflows/quote-invoice-sync-40.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-quotes-ui-40.js && node --check ite-invoice-ledger-ui-40.js && node --check ite-quote-invoice-bridge-ui-40.js
      - run: node test-quote-invoice-sync-40.js
