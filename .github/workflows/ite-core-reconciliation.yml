name: ITE 4.0 core reconciliation
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-core-reconciliation.js'
      - 'ite-core-operations-bridge.js'
      - 'ite-operations-integrity.js'
      - 'tests/core-reconciliation.test.cjs'
      - '.github/workflows/ite-core-reconciliation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-core-reconciliation.js
      - run: node --test tests/core-reconciliation.test.cjs
