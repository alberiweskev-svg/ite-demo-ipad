name: ITE 4.0 cross-archive audit
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-cross-archive-audit.js'
      - 'test-cross-archive-audit.js'
      - 'ite-document-history.js'
      - 'ite-document-history-ui.js'
      - 'ite-atomic-workspace.js'
      - 'index.html'
      - '.github/workflows/cross-archive-audit.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-cross-archive-audit.js
      - run: node --check ite-document-history-ui.js
      - run: node test-cross-archive-audit.js
      - run: node test-document-history.js
