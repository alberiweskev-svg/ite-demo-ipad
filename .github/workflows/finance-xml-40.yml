name: ITE 4.0 XML TEST intake
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-finance-xml-40.js'
      - 'ite-finance-xml-ui-40.js'
      - 'test-finance-xml-40.js'
      - 'test-finance-xml-multivat-40.js'
      - 'test-finance-xml-validation-40.js'
      - 'ite-finance-batch-40.js'
      - 'ite-finance-40.js'
      - 'index.html'
      - '.github/workflows/finance-xml-40.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-finance-xml-40.js && node --check ite-finance-xml-ui-40.js
      - run: node test-finance-40.js && node test-finance-batch-40.js && node test-finance-xml-40.js && node test-finance-xml-multivat-40.js && node test-finance-xml-validation-40.js
