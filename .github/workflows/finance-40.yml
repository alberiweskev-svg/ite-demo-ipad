name: ITE 4.0 Finance TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-finance-40.js', 'ite-finance-demo-ui-40.js', 'test-finance-40.js', '.github/workflows/finance-40.yml', 'index.html']
  workflow_dispatch:
jobs:
  finance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-finance-40.js && node --check ite-finance-demo-ui-40.js && node --check test-finance-40.js
      - run: node test-finance-40.js
