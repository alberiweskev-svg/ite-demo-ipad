name: Prepara componenti locali verificati
on:
  push:
    branches: [codex/security-test-3.0.73]
    paths:
      - tools/vendor-sources.json
      - tools/fetch-vendor.py
      - .github/workflows/vendor-local.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scarica versioni fissate e verifica SHA-256
        run: python3 tools/fetch-vendor.py
      - name: Conserva soltanto i componenti verificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Componenti locali con impronte verificate per 3.0.73'
          git push origin HEAD:${{ github.ref_name }}
