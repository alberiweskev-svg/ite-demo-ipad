name: ITE 4.0 service lifecycle
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-service-lifecycle.js'
      - 'ite-service-lifecycle-ui.js'
      - 'service-lifecycle-preview.html'
      - 'tests/service-lifecycle.test.cjs'
      - '.github/workflows/ite-service-lifecycle.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-service-lifecycle.js
      - run: node --check ite-service-lifecycle-ui.js
      - run: node --test tests/service-lifecycle.test.cjs
