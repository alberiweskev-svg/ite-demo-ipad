name: ITE 4.0.174 Field Extra Integration
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-field-workspace-ui-172.js','ite-intervention-extras-173.js','ite-intervention-extras-ui-174.js','test-intervention-extras-174.js','index.html','.github/workflows/intervention-extras-174.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-field-workspace-ui-172.js && node --check ite-intervention-extras-ui-174.js
      - run: node test-field-operations-171.js
      - run: node test-intervention-extras-173.js
      - run: node test-intervention-extras-174.js
