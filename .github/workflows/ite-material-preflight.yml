name: ITE 4.0 catalogue and receipt preflight
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-material-*.js'
      - 'tests/material-*.test.cjs'
      - '.github/workflows/ite-material-preflight.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in ite-material-*.js; do node --check "$f"; done
      - name: Material import test suite
        run: node --test tests/material-*.test.cjs
