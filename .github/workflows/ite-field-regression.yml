name: ITE 4.0 synthetic field regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [Europe/Rome, UTC]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(ite-field-*.js test-field-*.js)
          (("${#scripts[@]}" > 0)) || { echo "::error::No field scripts found"; exit 1; }
          for file in "${scripts[@]}"; do
            node --check "$file"
          done
      - name: Demo release asset verification
        run: node test-field-release-assets.js
      - name: Synthetic field regression
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(test-field-*.js)
          (("${#tests[@]}" > 0)) || { echo "::error::No field tests found"; exit 1; }
          for file in "${tests[@]}"; do
            echo "Running $file"
            node "$file"
          done
