name: ITE 4.0.110 ledger TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-ledger-110.js && node --check test-ledger-110.js
      - run: node test-ledger-110.js
      - run: node test-billing-109.js
