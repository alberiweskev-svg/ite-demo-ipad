name: Finance batch TEST 4.0
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-finance-40.js'
      - 'ite-finance-batch-40.js'
      - 'ite-finance-batch-ui-40.js'
      - 'test-finance-40.js'
      - 'test-finance-batch-40.js'
      - '.github/workflows/finance-batch-40.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-finance-batch-40.js && node --check ite-finance-batch-ui-40.js && node --check test-finance-batch-40.js
      - run: node test-finance-40.js && node test-finance-batch-40.js
