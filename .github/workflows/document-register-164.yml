name: ITE document register 4.0.164
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-document-register-164.js'
      - 'test-document-register-164.js'
      - '.github/workflows/document-register-164.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-document-register-164.js
      - run: node --check test-document-register-164.js
      - run: node test-document-register-164.js
