name: Commercial 4.0.149 regression
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-commercial-149.js'
      - 'test-commercial-149.js'
      - '.github/workflows/commercial-149.yml'
  workflow_dispatch:
jobs:
  commercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-commercial-149.js
      - run: node --check test-commercial-149.js
      - run: node test-commercial-149.js
