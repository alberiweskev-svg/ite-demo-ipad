name: ITE 4.0.46 Dossier integrated TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-technical-dossier-40.js'
      - 'ite-technical-dossier-ui-40.js'
      - 'test-technical-dossier-40.js'
      - 'test-technical-dossier-ui-40.js'
      - 'index.html'
      - '.github/workflows/dossier-integrated-40.yml'
  workflow_dispatch:
jobs:
  dossier-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-technical-dossier-40.js
      - run: node --check ite-technical-dossier-ui-40.js
      - run: node test-technical-dossier-40.js
      - run: node test-technical-dossier-ui-40.js
