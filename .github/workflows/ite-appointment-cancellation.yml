name: ITE appointment cancellation
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-service-lifecycle.js'
      - 'ite-operations-workspace.js'
      - 'tests/appointment-cancellation.test.cjs'
      - '.github/workflows/ite-appointment-cancellation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-service-lifecycle.js
      - run: node --check ite-operations-workspace.js
      - run: node --test tests/appointment-cancellation.test.cjs
