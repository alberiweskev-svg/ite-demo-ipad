name: ITE 4.0.163 Procurement integrated TEST
on:
  push:
    branches: [sviluppo-4.0.0-base]
  workflow_dispatch:
jobs:
  procurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-procurement-162.js && node --check ite-procurement-ui-163.js
      - run: node test-inventory-154.js && node test-supplier-import-160.js && node test-procurement-162.js && node test-procurement-163.js
