name: ITE 4.0 Finance Reconciliation
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths: ['ite-finance-reconciliation.js', 'test-finance-reconciliation.js', '.github/workflows/finance-reconciliation.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-finance-reconciliation.js
      - run: node test-finance-workflow.js
      - run: node test-finance-import.js
      - run: node test-finance-reconciliation.js
