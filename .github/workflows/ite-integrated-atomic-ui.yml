name: ITE 4.0 integrated atomic Safari workspace
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'index.html'
      - 'ite-integrated-workspace.js'
      - 'ite-atomic-*.js'
      - 'ite-operational-transactions.js'
      - 'test-integrated-atomic-ui.js'
      - '.github/workflows/ite-integrated-atomic-ui.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-integrated-workspace.js
      - run: node test-integrated-atomic-ui.js
      - run: node test-atomic-workspace.js
      - run: node test-atomic-migration.js
      - run: node test-integrated-workspace.js
