name: ITE operational technician integrity
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-operational-integrity.js'
      - 'tests/operational-technician-regression.test.cjs'
      - 'tests/operational-appointment-integrity.test.cjs'
      - '.github/workflows/ite-technician-integrity.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-operational-integrity.js
      - run: node --test tests/operational-technician-regression.test.cjs tests/operational-appointment-integrity.test.cjs
