name: ITE 4.0 Field Planning
on:
  push:
    branches: [sviluppo-4.0.0-base]
    paths:
      - 'ite-field-workflow.js'
      - 'ite-field-planning.js'
      - 'test-field-workflow.js'
      - 'test-field-planning.js'
      - '.github/workflows/field-planning.yml'
  workflow_dispatch:
jobs:
  field-planning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ite-field-workflow.js && node --check ite-field-planning.js
      - run: node test-field-workflow.js && node test-field-planning.js
