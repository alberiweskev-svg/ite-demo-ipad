<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>I.T.E. Gestionale 4.0 | Collaudo</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#162638;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#123c57;color:white;padding:18px 22px}header h1{font-size:1.35rem;margin:0}header small{opacity:.85}nav{display:flex;gap:7px;overflow:auto;padding:12px;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #d9e1e8}button{font:inherit;cursor:pointer;border:1px solid #b9c8d4;border-radius:8px;background:white;padding:10px 13px}button.primary{background:#136b8b;color:white;border-color:#136b8b}button.active{background:#123c57;color:white}main{max-width:1200px;margin:auto;padding:18px}.panel{background:white;border:1px solid #dae2e9;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}label{font-weight:600;font-size:.9rem}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #adbdcb;border-radius:7px;min-height:42px}textarea{min-height:70px}table{border-collapse:collapse;width:100%;font-size:.91rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #e0e6eb;vertical-align:top}th{background:#edf3f7}section{overflow-x:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#566779}.notice{background:#eaf5f9;padding:12px;border-radius:8px}.error{background:#fff0ec;color:#9c2715;padding:12px;border-radius:8px}#status{min-height:22px} .tag{font-size:.75rem;background:#e4eff5;border-radius:5px;padding:3px 6px} @media(max-width:600px){main{padding:10px}.panel{padding:12px}th,td{padding:7px}header{padding:14px}}
</style></head><body>
<header><h1>I.T.E. — Gestionale 4.0</h1><small>Demo integrata di collaudo 4.0.239 · solo dati sintetici · archivio locale al dispositivo</small></header>
<nav id="nav" aria-label="Moduli"></nav><main><div id="status" role="status" aria-live="polite"></div><div id="view"></div></main>
<script src="../ite-integrated-core-225.js"></script>
<script src="agenda-227.js"></script>
<script src="operations-228.js"></script>
<script src="document-intake-229.js"></script>
<script src="document-workspace-237.js"></script>
<script src="finance-230.js"></script>
<script src="workflow-231.js"></script>
<script src="quality-232.js"></script>
<script src="service-233.js"></script>
<script src="recovery-234.js"></script>
<script>
(()=>{'use strict';
const core=window.ITEIntegratedCore225,KEY='ITE_4_0_226_DEMO_SYNTHETIC',types=['clients','sites','plants','equipment','appointments','interventions','quotes','invoices','documents'];
const titles={clients:'Clienti',sites:'Sedi e immobili',plants:'Impianti',equipment:'Apparecchiature',appointments:'Calendario',interventions:'Interventi',quotes:'Preventivi ed Extra',invoices:'Fatture',documents:'Documenti tecnici'};
const fields={
clients:[['name','Nome cliente','text']],
sites:[['clientId','Cliente','clients'],['address','Indirizzo sede','text']],
plants:[['siteId','Sede','sites'],['type','Tipologia impianto','text']],
equipment:[['plantId','Impianto','plants'],['type','Tipologia apparecchio','text'],['brand','Marca','text'],['model','Modello','text'],['serial','Matricola','text']],
appointments:[['siteId','Sede','sites'],['operator','Operatore','text'],['start','Inizio','datetime-local'],['end','Fine','datetime-local']],
interventions:[['siteId','Sede','sites'],['equipmentId','Apparecchiatura (facoltativa)','equipment'],['appointmentId','Appuntamento (facoltativo)','appointments'],['operator','Operatore','text'],['status','Stato','APERTO|IN_CORSO|CHIUSO'],['arrival','Arrivo (facoltativo)','datetime-local'],['exit','Uscita (facoltativo)','datetime-local']],
quotes:[['clientId','Cliente','clients'],['status','Stato','BOZZA|INVIATO|ACCETTATO|RIFIUTATO']],
invoices:[['clientId','Cliente','clients'],['kind','Tipo','ACQUISTO|VENDITA|PROFORMA|TD04'],['number','Numero documento','text'],['cents','Importo euro','money'],['quoteId','Preventivo (facoltativo)','quotes'],['originalInvoiceId','ID fattura originale (solo TD04)','text']],
documents:[['kind','Tipologia','DICO|DIRI|POS|CAD|GAS|ALLEGATO'],['filename','Nome file PDF (solo metadati)','text'],['mime','Formato','application/pdf'],['bytes','Dimensione byte','number'],['clientId','Cliente (facoltativo)','clients'],['siteId','Sede (facoltativa)','sites']]};
let store,tab='clients',agendaMode='settimana',agendaDate=ITEAgenda227.dayKey(new Date()),agendaOperator='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initial(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):core.blank()}catch(e){return core.blank()}}
try{store=core.createStore(initial())}catch(e){store=core.createStore();message('Archivio locale non valido: avvio con dati vuoti. '+e.message,true)}
function message(s,bad=false){$('#status').innerHTML='<p class="'+(bad?'error':'notice')+'">'+esc(s)+'</p>'}
let committedSnapshot=store.snapshot();
function save(){try{const result=ITERecovery234.persist(localStorage,KEY,store.exportMetadata(),core.validate);committedSnapshot=store.snapshot();if(result.historySaved===false)message('Archivio salvato, ma cronologia non aggiornata: '+result.warning,true);return true}catch(e){store=core.createStore(committedSnapshot);render();message('Operazione annullata: salvataggio locale non riuscito ('+e.message+'). Archivio precedente ripristinato; esportare JSON.',true);return false}}
function transact(fn){const before=store.snapshot();try{store.transact(before.revision,fn);if(!save()){store=core.createStore(committedSnapshot);render();message('Modifica annullata: salvataggio locale non riuscito. Esportare un backup JSON.',true);return false}render();message('Operazione completata e archivio aggiornato.');return true}catch(e){store=core.createStore(before);message('Operazione rifiutata: '+e.message,true);return false}}
function name(type,item){return item.name||item.address||item.type||item.number||item.filename||item.operator||item.id}
function control(f,state){const [key,label,kind]=f,optional=/facoltativ/i.test(label),value=kind==='application/pdf'?'application/pdf':(key==='status'?'BOZZA':'');
let html='<div class="field"><label for="f_'+key+'">'+esc(label)+'</label>';
if(types.includes(kind)){html+='<select id="f_'+key+'" name="'+key+'" '+(!optional?'required':'')+'><option value="">'+(optional?'Nessuno':'Seleziona')+'</option>'+state[kind].map(x=>'<option value="'+esc(x.id)+'">'+esc(name(kind,x))+' ('+esc(x.id)+')</option>').join('')+'</select>'}
else if(kind.includes('|'))html+='<select id="f_'+key+'" name="'+key+'">'+kind.split('|').map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>';
else html+='<input id="f_'+key+'" name="'+key+'" type="'+(kind==='money'?'number':kind)+'" '+(kind==='money'?'step="0.01" min="0"':kind==='number'?'min="0"':'')+' value="'+esc(value)+'" '+(!optional?'required':'')+'>';
return html+'</div>'}
function render(){const s=store.snapshot();$('#nav').innerHTML='<button data-tab="overview" class="'+(tab==='overview'?'active':'')+'">Riepilogo operativo</button>'+types.map(t=>'<button data-tab="'+t+'" class="'+(t===tab?'active':'')+'">'+titles[t]+'</button>').join('')+'<button data-tab="service">Scheda sede e interventi</button><button data-tab="workflow" class="'+(tab==='workflow'?'active':'')+'">Flusso lavori</button><button data-tab="agenda" class="'+(tab==='agenda'?'active':'')+'">Agenda grafica</button><button data-tab="quality" class="'+(tab==='quality'?'active':'')+'">Qualità dati</button><button data-tab="tools" class="'+(tab==='tools'?'active':'')+'">Backup e strumenti</button>';
if(tab==='service'){renderService(s);return}if(tab==='quality'){renderQuality(s);return}if(tab==='workflow'){renderWorkflow(s);return}if(tab==='tools'){renderTools(s);return}if(tab==='documents'){renderDocuments(s);return}if(tab==='overview'){renderOverview(s);return}if(tab==='agenda'){renderAgenda(s);return}
const f=fields[tab];let extra=tab==='quotes'?'<h3>Righe del preventivo</h3><p class="muted">Una riga per ogni fornitura, posa, Extra, smontaggio o smaltimento. Prezzi in euro, quantità intere.</p><div id="lines"></div><button type="button" id="addline">Aggiungi riga</button>':'';
$('#view').innerHTML='<div class="panel"><h2>'+titles[tab]+'</h2><p class="muted">Gerarchia e relazioni validate dal motore 4.0.225. Nessun dato inviato a server.</p><form id="entry"><div class="grid">'+f.map(x=>control(x,s)).join('')+'</div>'+extra+'<div class="actions"><button class="primary" type="submit">Registra</button></div></form></div><div class="panel"><h3>Archivio ('+s[tab].length+')</h3><section><table><thead><tr><th>ID</th><th>Dettagli</th><th>Azioni</th></tr></thead><tbody>'+s[tab].map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+Object.entries(x).filter(([k])=>k!=='id').map(([k,v])=>'<span class="tag">'+esc(k)+'</span> '+esc(typeof v==='object'?JSON.stringify(v):v)+' ').join('<div></div>')+(tab==='quotes'?'<p><b>Totale: € '+core.totals(x).eur+'</b></p>':'')+'</td><td><button data-delete="'+esc(x.id)+'">Elimina</button></td></tr>').join('')+'</tbody></table></section></div>';
if(tab==='quotes'){$('#addline').onclick=addLine;addLine()}
$('#entry').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),obj={id:crypto.randomUUID?crypto.randomUUID():('demo-'+Date.now()+'-'+Math.random().toString(36).slice(2))};for(const [key,,kind] of f){let v=fd.get(key);if(!v)continue;if(kind==='money'){v=Math.round(Number(v)*100);if(!Number.isSafeInteger(v))return message('Importo non valido',true)}else if(kind==='number')v=Number(v);else if(kind==='datetime-local')v=v+':00';obj[key]=v}
if(tab==='quotes'){obj.lines=[];document.querySelectorAll('.quote-line').forEach((el,i)=>{const desc=el.querySelector('[name=description]').value.trim();if(desc)obj.lines.push({id:'r'+(i+1),kind:el.querySelector('[name=kind]').value,description:desc,cents:Math.round(Number(el.querySelector('[name=price]').value)*100),qty:Number(el.querySelector('[name=qty]').value)})})}
if(tab==='documents')obj.mime='application/pdf';if(tab==='appointments'){const c=window.ITEAgenda227.conflicts(store.snapshot(),obj);if(c.length)return message('Operatore già impegnato: '+c.length+' appuntamento/i sovrapposti',true)}transact(s=>s[tab].push(obj))};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Eliminare questo record? Le relazioni collegate devono restare valide.'))return;transact(s=>{s[tab]=s[tab].filter(x=>x.id!==b.dataset.delete)})})}
function addLine(){const d=document.createElement('div');d.className='grid quote-line';d.style.margin='12px 0';d.innerHTML='<div class="field"><label>Tipo riga</label><select name="kind">'+['FORNITURA','POSA','EXTRA_FORNITURA','EXTRA_POSA','SMONTAGGIO','SMALTIMENTO'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Descrizione</label><input name="description" maxlength="1000" required></div><div class="field"><label>Prezzo unitario €</label><input name="price" type="number" step=".01" min="0" required></div><div class="field"><label>Quantità</label><input name="qty" type="number" min="1" step="1" value="1" required></div>';$('#lines').append(d)}

function renderAgenda(s){
 const a=window.ITEAgenda227,ops=[...new Set(s.appointments.map(x=>x.operator))].sort(),ev=a.events(s,agendaDate,agendaMode,agendaOperator);
 const fmt=x=>esc(x.slice(0,16).replace('T',' '));
 const interventions=id=>s.interventions.filter(x=>x.appointmentId===id);
 $('#view').innerHTML='<div class="panel"><h2>Agenda operativa</h2><p class="muted">Viste giorno, settimana e mese; filtro operatore; apertura e chiusura interventi. Orari locali del dispositivo.</p><div class="grid"><div class="field"><label for="agenda-date">Data</label><input id="agenda-date" type="date" value="'+esc(agendaDate)+'"></div><div class="field"><label for="agenda-mode">Vista</label><select id="agenda-mode">'+['giorno','settimana','mese'].map(m=>'<option '+(m===agendaMode?'selected':'')+'>'+m+'</option>').join('')+'</select></div><div class="field"><label for="agenda-operator">Operatore</label><select id="agenda-operator"><option value="">Tutti</option>'+ops.map(o=>'<option value="'+esc(o)+'" '+(o===agendaOperator?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div></div><div class="actions"><button id="agenda-prev">Precedente</button><button id="agenda-today">Oggi</button><button id="agenda-next">Successivo</button></div><p>'+ev.length+' appuntamenti nel periodo</p><section><table><thead><tr><th>Inizio / fine</th><th>Sede e operatore</th><th>Intervento</th><th>Azioni</th></tr></thead><tbody>'+ev.map(x=>{const iv=interventions(x.id),site=s.sites.find(y=>y.id===x.siteId);return '<tr><td>'+fmt(x.start)+'<div>'+fmt(x.end)+'</div></td><td>'+esc(site?site.address:x.siteId)+'<div>'+esc(x.operator)+'</div></td><td>'+esc(iv.length?iv[0].status:'Non aperto')+'</td><td>'+(!iv.length?'<button data-open="'+esc(x.id)+'">Apri intervento</button>':iv[0].status==='APERTO'?'<button data-arrival="'+esc(iv[0].id)+'">Sono arrivato</button>':iv[0].status==='IN_CORSO'?'<button data-close="'+esc(iv[0].id)+'">Chiudi intervento</button>':'Chiuso')+'</td></tr>'}).join('')+'</tbody></table></section></div>';
 $('#agenda-date').onchange=e=>{agendaDate=e.target.value;render()};
 $('#agenda-mode').onchange=e=>{agendaMode=e.target.value;render()};
 $('#agenda-operator').onchange=e=>{agendaOperator=e.target.value;render()};
 $('#agenda-today').onclick=()=>{agendaDate=a.dayKey(new Date());render()};
 for(const [id,delta] of [['agenda-prev',-1],['agenda-next',1]])$('#'+id).onclick=()=>{const d=new Date(agendaDate+'T12:00:00');if(agendaMode==='mese')d.setMonth(d.getMonth()+delta);else d.setDate(d.getDate()+delta*(agendaMode==='settimana'?7:1));agendaDate=a.dayKey(d);render()};
 const now=()=>{const d=new Date();return a.dayKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00'};
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{try{a.openFromAppointment(store,b.dataset.open,crypto.randomUUID());save();render();message('Intervento aperto')}catch(e){message(e.message,true)}});
 document.querySelectorAll('[data-arrival]').forEach(b=>b.onclick=()=>{try{a.arrival(store,b.dataset.arrival,now());save();render();message('Arrivo registrato')}catch(e){message(e.message,true)}});
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{try{a.close(store,b.dataset.close,now());save();render();message('Uscita e chiusura registrate')}catch(e){message(e.message,true)}});
}

function renderOverview(s){
 const fin=window.ITEFinance230.summary(s), euro=n=>(n/100).toFixed(2).replace('.',',');
 const financePanel='<div class="panel"><h2>Quadro fatture e note di credito 4.0.230</h2><p class="muted">Riepilogo locale dimostrativo; non sostituisce contabilità o invio fiscale.</p><div class="grid">'+[['Vendite lorde',fin.salesGrossCents],['Vendite nette dopo TD04',fin.salesNetCents],['Acquisti',fin.purchaseCents],['Proforma',fin.proformaCents],['Note di credito',fin.creditCents]].map(x=>'<div class="notice"><b>'+esc(x[0])+'</b><div>€ '+euro(x[1])+'</div></div>').join('')+'</div><h3>Verifica documenti</h3><p>'+fin.audit.errors.length+' errori · '+fin.audit.warning.length+' avvisi</p>'+[...fin.audit.errors,...fin.audit.warning].map(x=>'<p class="error">'+esc(x.code)+' — '+esc(x.id)+'</p>').join('')+'</div>';

 const ops=window.ITEOperations228,report=ops.summary(s),fmt=n=>String(n);
 $('#view').innerHTML=financePanel+'<div class="panel"><h2>Riepilogo operativo 4.0.228</h2><p class="muted">Controlli incrociati non distruttivi su agenda, interventi, apparecchiature, fatture e documenti. Solo dati locali.</p><div class="grid">'+[['Clienti',report.clients],['Sedi',report.sites],['Impianti',report.plants],['Apparecchiature',report.equipment],['Appuntamenti',report.appointments],['Interventi aperti',report.openInterventions],['Preventivi accettati',report.acceptedQuotes],['Fatture',report.invoices],['Documenti',report.documents],['Anomalie',report.issues.length]].map(x=>'<div class="notice"><b>'+esc(x[0])+'</b><div>'+fmt(x[1])+'</div></div>').join('')+'</div><h3>Controlli di coerenza</h3>'+(report.issues.length?'<table><thead><tr><th>Controllo</th><th>Record</th></tr></thead><tbody>'+report.issues.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.id)+'</td></tr>').join('')+'</tbody></table>':'<p class="notice">Nessuna anomalia rilevata dai controlli disponibili.</p>')+'</div><div class="panel"><h2>Stato preventivi</h2><table><thead><tr><th>Preventivo</th><th>Stato</th><th>Totale</th><th>Avanzamento</th></tr></thead><tbody>'+s.quotes.map(q=>'<tr><td>'+esc(q.id)+'</td><td>'+esc(q.status)+'</td><td>€ '+esc(core.totals(q).eur)+'</td><td>'+({BOZZA:'<button data-quote="'+esc(q.id)+'" data-next="INVIATO">Invia</button>',INVIATO:'<button data-quote="'+esc(q.id)+'" data-next="ACCETTATO">Accetta</button> <button data-quote="'+esc(q.id)+'" data-next="RIFIUTATO">Rifiuta</button>',RIFIUTATO:'<button data-quote="'+esc(q.id)+'" data-next="BOZZA">Riapri bozza</button>',ACCETTATO:'Definitivo'}[q.status]||'')+'</td></tr>').join('')+'</tbody></table></div><div class="panel"><h2>Nota di credito TD04</h2><form id="credit-form"><div class="grid"><div class="field"><label>Fattura vendita originaria</label><select name="source" required>'+s.invoices.filter(x=>x.kind==='VENDITA').map(x=>'<option value="'+esc(x.id)+'">'+esc(x.number)+' — € '+(x.cents/100).toFixed(2)+'</option>').join('')+'</select></div><div class="field"><label>Numero TD04</label><input name="number" required maxlength="180"></div><div class="field"><label>Importo credito (€)</label><input name="amount" type="number" min=".01" step=".01" required></div></div><div class="actions"><button class="primary" type="submit">Registra TD04</button></div></form><p class="muted">Il credito totale non può superare l&#39;importo della fattura originaria.</p></div>';
 document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>{try{ops.changeQuote(store,b.dataset.quote,b.dataset.next);save();render();message('Stato preventivo aggiornato')}catch(e){message(e.message,true)}});
 $('#credit-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{ops.addCreditNote(store,f.get('source'),crypto.randomUUID(),String(f.get('number')).trim(),Math.round(Number(f.get('amount'))*100));save();render();message('Nota di credito registrata')}catch(err){message(err.message,true)}};
}


function renderDocuments(s){
 const intake=window.ITEDocumentIntake229,workspace=window.ITEDocumentWorkspace237,report=workspace.audit(s);
 const clientOptions=s.clients.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
 const siteOptions=s.sites.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.address)+'</option>').join('');
 $('#view').innerHTML='<div class="panel"><h2>Archivio documentale · 4.0.239</h2><p class="notice">Solo metadati PDF sintetici: nessun contenuto PDF viene salvato, caricato o convertito. Importazione in lotto (massimo 30 file) con verifica di formato, duplicati e collegamento cliente/sede. Non equivale alla ricostruzione Di.Co./Di.Ri.</p><form id="pdf-batch"><div class="grid"><label>PDF dimostrativi<input name="files" type="file" accept=".pdf,application/pdf" multiple required></label><label>Categoria<select name="kind"><option value="AUTO">Automatica dal nome</option>'+intake.kinds.map(k=>'<option value="'+k+'">'+k+'</option>').join('')+'</select></label><label>Cliente<select name="clientId"><option value="">Nessuno</option>'+clientOptions+'</select></label><label>Sede<select name="siteId"><option value="">Nessuna</option>'+siteOptions+'</select></label></div><div class="actions"><button type="button" id="pdf-preview">Verifica lotto senza salvare</button><button class="primary">Registra lotto PDF</button></div><p id="pdf-preview-result" role="status" aria-live="polite" class="muted">Seleziona file e collegamenti, poi verifica prima della registrazione.</p></form><p>Documenti: '+report.total+' · '+Object.entries(report.byKind).map(([k,n])=>esc(k)+': '+n).join(' · ')+'</p>'+(report.issues.length?report.issues.map(i=>'<p class="error">'+esc(i.code)+' '+esc(i.id)+'</p>').join(''):'<p class="notice">Nessuna anomalia documentale rilevata.</p>')+'</div><div class="panel"><h3>Registro documenti</h3><section><table><thead><tr><th>Tipo</th><th>File</th><th>Cliente / sede</th><th>Azione</th></tr></thead><tbody>'+s.documents.map(d=>'<tr><td>'+esc(d.kind)+'</td><td>'+esc(d.filename)+' ('+esc(d.bytes)+' byte)</td><td>'+esc(d.clientId||'')+' / '+esc(d.siteId||'')+'</td><td><button data-doc-delete="'+esc(d.id)+'">Elimina metadati</button></td></tr>').join('')+'</tbody></table></section></div>';
 const batchForm=$('#pdf-batch');const inspectSelected=async()=>{const fd=new FormData(batchForm),files=batchForm.elements.files.files;const items=await workspace.inspectBatch(files,String(fd.get('kind')),String(fd.get('clientId')||''),String(fd.get('siteId')||''));return {items,report:workspace.previewBatch(store,items)};};
 $('#pdf-preview').onclick=async()=>{try{const {report}=await inspectSelected();$('#pdf-preview-result').textContent='Lotto valido: '+report.count+' PDF · '+Object.entries(report.byKind).filter(([,n])=>n).map(([k,n])=>k+': '+n).join(' · ')+' · Nessuna modifica effettuata.';}catch(err){$('#pdf-preview-result').textContent='Verifica non superata: '+err.message;}};
 batchForm.onsubmit=async e=>{e.preventDefault();try{const {items}=await inspectSelected();const uid=()=>crypto.randomUUID?crypto.randomUUID():'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2);workspace.addBatch(store,items,uid);if(save()){render();message('Lotto di '+items.length+' documenti registrato e salvato.')} }catch(err){message('Lotto non registrato: '+err.message,true)}};
 document.querySelectorAll('[data-doc-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Eliminare i metadati del documento?'))return;transact(st=>{st.documents=st.documents.filter(d=>d.id!==b.dataset.docDelete)})});
}

function renderWorkflow(s){
 const w=window.ITEWorkflow231,r=w.overview(s),money=n=>'€ '+w.euro(n),siteOpts=s.sites.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.address)+'</option>').join(''),appOpts=s.appointments.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.operator)+' — '+esc(x.start)+'</option>').join('');
 $('#view').innerHTML='<div class="panel"><h2>Flusso lavori 4.0.231</h2><p class="muted">Appuntamento → preventivo con fornitura e posa separate → fattura da preventivo accettato. Solo dati dimostrativi locali.</p><p>Interventi non chiusi: '+r.open+' · Documenti: '+r.documents+' · Anomalie: '+r.issues.length+'</p><h3>Nuovo appuntamento</h3><form id="wf-visit"><div class="grid"><label>Sede<select name="site" required>'+siteOpts+'</select></label><label>Operatore<input name="operator" required></label><label>Inizio<input type="datetime-local" name="start" required></label><label>Fine<input type="datetime-local" name="end" required></label></div><button class="primary">Registra appuntamento</button></form><h3>Preventivo da appuntamento</h3><form id="wf-quote"><div class="grid"><label>Appuntamento<select name="appointment" required>'+appOpts+'</select></label><label>Fornitura (€)<input type="number" min="0" step=".01" name="supply" required></label><label>Posa (€)<input type="number" min="0" step=".01" name="labor" required></label></div><button class="primary">Crea preventivo in bozza</button></form></div><div class="panel"><h3>Preventivi e fatturazione</h3><section><table><thead><tr><th>ID</th><th>Stato</th><th>Fornitura</th><th>Posa</th><th>Totale</th><th>Fattura</th></tr></thead><tbody>'+r.quotes.map(q=>'<tr><td>'+esc(q.id)+'</td><td>'+esc(q.status)+'</td><td>'+money(q.supplyCents)+'</td><td>'+money(q.laborCents)+'</td><td>'+money(q.totalCents)+'</td><td>'+(r.unbilled.some(x=>x.id===q.id)?'<button data-bill="'+esc(q.id)+'">Emetti fattura demo</button>':s.invoices.some(i=>i.kind==='VENDITA'&&i.quoteId===q.id)?'Già fatturato':'—')+'</td></tr>').join('')+'</tbody></table></section><h3>Verifiche</h3>'+(r.issues.length?r.issues.map(i=>'<p class="error">'+esc(i.code)+' — '+esc(i.id)+'</p>').join(''):'<p class="notice">Nessuna anomalia rilevata.</p>')+'</div>';
 const uid=()=>crypto.randomUUID?crypto.randomUUID():'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const cents=v=>{const n=Number(v);if(!Number.isFinite(n)||n<0||!Number.isSafeInteger(Math.round(n*100)))throw Error('IMPORTO_NON_VALIDO');return Math.round(n*100)};
 $('#wf-visit').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);try{w.createVisit(store,{id:uid(),siteId:d.get('site'),operator:String(d.get('operator')).trim(),start:d.get('start')+':00',end:d.get('end')+':00'});save();render();message('Appuntamento registrato')}catch(err){message(err.message,true)}};
 $('#wf-quote').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);try{w.quoteFromVisit(store,{id:uid(),appointmentId:d.get('appointment'),lines:[{id:'fornitura',kind:'FORNITURA',description:'Fornitura dimostrativa',cents:cents(d.get('supply')),qty:1},{id:'posa',kind:'POSA',description:'Posa dimostrativa',cents:cents(d.get('labor')),qty:1}]});save();render();message('Preventivo in bozza creato')}catch(err){message(err.message,true)}};
 document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>{const number=prompt('Numero fattura dimostrativa (non fiscale)');if(!number)return;try{w.invoiceFromQuote(store,{id:uid(),quoteId:b.dataset.bill,number});save();render();message('Fattura dimostrativa registrata')}catch(err){message(err.message,true)}});
}


function renderService(s){
 const api=window.ITEService233,sites=s.sites,uid=()=>crypto.randomUUID?crypto.randomUUID():'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const selected=window.iteServiceSite&&sites.some(x=>x.id===window.iteServiceSite)?window.iteServiceSite:(sites[0]&&sites[0].id);
 if(!selected){$('#view').innerHTML='<div class="panel"><h2>Scheda sede e interventi</h2><p>Registrare prima un cliente e una sede.</p></div>';return;}
 const d=api.dossier(s,selected),e=d.equipment,appointments=d.appointments.filter(a=>!s.interventions.some(i=>i.appointmentId===a.id)),active=d.interventions.filter(i=>i.status==='IN_CORSO');
 const opts=items=>items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.operator||x.type||x.id)+' — '+esc(x.start||x.model||x.id)+'</option>').join('');
 const rows=(items,describe)=>items.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(describe(x))+'</td></tr>').join('');
 $('#view').innerHTML='<div class="panel"><h2>Scheda sede · 4.0.233</h2><p class="muted">Archivio dimostrativo locale. Appuntamenti, interventi, impianti e documenti collegati alla sede.</p><label for="service-site">Seleziona sede</label><select id="service-site">'+sites.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===selected?'selected':'')+'>'+esc(x.address)+'</option>').join('')+'</select><p><b>Cliente:</b> '+esc(d.client.name)+' · <b>Sede:</b> '+esc(d.site.address)+'</p><div class="grid">'+[['Impianti',d.plants.length],['Apparecchiature',e.length],['Appuntamenti',d.appointments.length],['Interventi',d.interventions.length],['Documenti',d.documents.length],['Preventivi cliente',d.quotes.length],['Fatture cliente',d.invoices.length]].map(x=>'<div class="notice"><b>'+x[0]+'</b><div>'+x[1]+'</div></div>').join('')+'</div><h3>Apparecchiature</h3><table><tbody>'+rows(e,x=>x.type+' '+(x.brand||'')+' '+(x.model||''))+'</tbody></table><h3>Interventi</h3><table><tbody>'+rows(d.interventions,x=>x.operator+' · '+x.status+' · '+(x.arrival||'')+' → '+(x.exit||''))+'</tbody></table><h3>Documenti</h3><table><tbody>'+rows(d.documents,x=>x.kind+' · '+x.filename)+'</tbody></table></div>'+
 '<div class="panel"><h2>Pianificazione e tempi</h2><form id="service-plan"><div class="grid"><label>Operatore<input name="operator" required maxlength="180"></label><label>Inizio<input name="start" type="datetime-local" required></label><label>Fine<input name="end" type="datetime-local" required></label></div><button class="primary">Pianifica appuntamento</button></form><h3>Registra arrivo</h3><form id="service-start"><div class="grid"><label>Appuntamento<select name="appointment" required>'+opts(appointments)+'</select></label><label>Apparecchiatura<select name="equipment"><option value="">Nessuna</option>'+e.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.type)+' · '+esc(x.id)+'</option>').join('')+'</select></label><label>Arrivo<input name="arrival" type="datetime-local" required></label></div><button class="primary" '+(!appointments.length?'disabled':'')+'>Sono arrivato</button></form><h3>Registra uscita e chiudi</h3><form id="service-finish"><div class="grid"><label>Intervento<select name="intervention" required>'+opts(active)+'</select></label><label>Uscita<input name="exit" type="datetime-local" required></label></div><button class="primary" '+(!active.length?'disabled':'')+'>Chiudi intervento</button></form></div>'+
 '<div class="panel"><h2>Carico operatori</h2><table><thead><tr><th>Operatore</th><th>Appuntamenti</th><th>Minuti previsti</th><th>Interventi aperti</th><th>Chiusi</th><th>Minuti rilevati</th></tr></thead><tbody>'+api.workload(s).map(x=>'<tr>'+[x.operator,x.appointments,x.plannedMinutes,x.open,x.closed,x.actualMinutes].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 $('#service-site').onchange=ev=>{window.iteServiceSite=ev.target.value;render()};
 $('#service-plan').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);try{api.schedule(store,{id:uid(),siteId:selected,operator:String(f.get('operator')).trim(),start:f.get('start')+':00',end:f.get('end')+':00'});save();render();message('Appuntamento registrato')}catch(err){message(err.message,true)}};
 $('#service-start').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget),a=s.appointments.find(x=>x.id===f.get('appointment'));try{api.start(store,{appointmentId:a.id,interventionId:uid(),operator:a.operator,arrival:f.get('arrival')+':00',equipmentId:f.get('equipment')||undefined});save();render();message('Arrivo registrato')}catch(err){message(err.message,true)}};
 $('#service-finish').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);try{api.finish(store,{interventionId:f.get('intervention'),exit:f.get('exit')+':00'});save();render();message('Intervento chiuso')}catch(err){message(err.message,true)}};
}

function renderQuality(s){
const q=window.ITEQuality232,r=q.audit(s);
$('#view').innerHTML='<div class="panel"><h2>Qualità dati 4.0.232</h2><p class="muted">Analisi di sola lettura, senza modifiche automatiche. Esportazioni CSV locali, senza invio a server.</p><p>Revisione '+r.revision+' · Anomalie: '+r.issues.length+' · Interventi aperti: '+r.open.length+' · Preventivi accettati non fatturati: '+r.pending.length+'</p><div class="grid">'+Object.entries(r.count).map(([k,v])=>'<div class="notice"><b>'+esc(titles[k])+'</b><div>'+v+'</div></div>').join('')+'</div><h3>Anomalie</h3>'+(r.issues.length?r.issues.map(i=>'<p class="error">'+esc(i.code)+' — '+esc(i.type)+' — '+esc(i.id)+'</p>').join(''):'<p class="notice">Nessuna anomalia rilevata dai controlli disponibili.</p>')+'<h3>Esportazione CSV</h3><div class="actions"><select id="quality-type" aria-label="Categoria CSV">'+q.kinds.map(k=>'<option value="'+k+'">'+esc(titles[k])+'</option>').join('')+'</select><button class="primary" id="quality-export">Esporta CSV</button></div><p class="muted">Il CSV contiene dati dell’archivio locale: non condividere esportazioni con dati reali. Il backup completo resta il JSON.</p></div>';
$('#quality-export').onclick=()=>{const kind=$('#quality-type').value,blob=new Blob([q.exportCsv(store.snapshot(),kind)],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ite-demo-4.0.232-'+kind+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
}

function renderTools(s){
 const rec=ITERecovery234.inspect(localStorage,KEY,core.validate);
 const options=rec.history.map(h=>'<option value="'+h.index+'">Revisione '+esc(h.revision)+' · '+h.counts.clients+' clienti · '+h.counts.documents+' documenti</option>').join('');
 $('#view').innerHTML='<div class="panel"><h2>Backup e recupero archivio</h2><p class="notice">Archivio di collaudo conservato in questo browser. La cronologia locale non sostituisce il backup esterno: esportare regolarmente JSON. Nessun PDF viene acquisito o pubblicato.</p><p>Schema: '+esc(s.schema)+' · Revisione: '+s.revision+'</p><p>Archivio corrente: '+(rec.valid?'valido':'non valido')+' · Versioni recuperabili: '+rec.history.length+' · Salvataggio interrotto: '+(rec.interrupted?'sì':'no')+'</p>'+(rec.problem?'<p class="error">'+esc(rec.problem)+'</p>':'')+'<div class="actions"><button id="export" class="primary">Esporta JSON</button><label>Importa JSON di collaudo <input id="import" type="file" accept=".json,application/json"></label><button id="reset">Azzera dati demo</button><button id="seed">Carica dati sintetici</button></div><h3>Ripristino locale</h3><div class="grid"><label>Versione salvata<select id="recovery-version" '+(!rec.history.length?'disabled':'')+'>'+options+'</select></label></div><div class="actions"><button id="restore" '+(!rec.history.length?'disabled':'')+'>Ripristina versione selezionata</button><button id="pending" '+(!rec.interrupted?'disabled':'')+'>Recupera salvataggio interrotto</button></div><p class="muted">Il ripristino sostituisce l’archivio corrente e conserva, quando possibile, una copia della versione precedente. Import PDF completo, moduli tecnici 2.7.5 e sincronizzazione multi-dispositivo non ancora disponibili.</p></div>';
 $('#restore').onclick=()=>{if(!confirm('Ripristinare questa versione? L’archivio corrente sarà sostituito.'))return;try{const recovered=ITERecovery234.restore(localStorage,KEY,Number($('#recovery-version').value),core.validate);store=core.createStore(recovered);committedSnapshot=store.snapshot();render();message('Versione locale recuperata')}catch(e){message('Recupero non riuscito: '+e.message,true)}};
 $('#pending').onclick=()=>{if(!confirm('Recuperare il salvataggio interrotto?'))return;try{const recovered=ITERecovery234.recoverPending(localStorage,KEY,core.validate);store=core.createStore(recovered);committedSnapshot=store.snapshot();render();message('Salvataggio interrotto recuperato')}catch(e){message('Recupero non riuscito: '+e.message,true)}};
$('#export').onclick=()=>{const blob=new Blob([store.exportMetadata()],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ite-demo-4.0.236-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>3000000)return message('File troppo grande',true);try{const previous=store.snapshot();store.importMetadata(await file.text(),previous.revision);if(!save()){store=core.createStore(previous);render();return message('Importazione annullata: impossibile salvare sul dispositivo',true)}render();message('Backup importato e validato')}catch(err){message('Importazione rifiutata: '+err.message,true)}};
$('#reset').onclick=()=>{if(!confirm('Cancellare tutti i dati locali di questa demo?'))return;const previous=store;store=core.createStore();if(!save()){store=previous;render();return message('Azzeramento annullato: impossibile salvare',true)}render();message('Archivio demo azzerato')};
$('#seed').onclick=()=>{if(store.snapshot().clients.length)return message('Caricare i dati sintetici solo su archivio vuoto',true);transact(s=>{s.clients.push({id:'demo-cliente',name:'Cliente Dimostrativo'});s.sites.push({id:'demo-sede',clientId:'demo-cliente',address:'Via Esempio 1, Bologna'});s.plants.push({id:'demo-impianto',siteId:'demo-sede',type:'Riscaldamento'});s.equipment.push({id:'demo-caldaia',plantId:'demo-impianto',type:'Caldaia',brand:'Marca Demo'});s.appointments.push({id:'demo-app',siteId:'demo-sede',operator:'Tecnico Demo',start:'2026-11-23T09:00:00',end:'2026-11-23T10:00:00'});s.interventions.push({id:'demo-intervento',siteId:'demo-sede',equipmentId:'demo-caldaia',appointmentId:'demo-app',operator:'Tecnico Demo',status:'APERTO'});s.quotes.push({id:'demo-preventivo',clientId:'demo-cliente',status:'BOZZA',lines:[{id:'fornitura',kind:'FORNITURA',description:'Materiale dimostrativo',cents:10000,qty:1},{id:'posa',kind:'POSA',description:'Installazione dimostrativa',cents:8000,qty:1}]});s.invoices.push({id:'demo-fattura',clientId:'demo-cliente',kind:'PROFORMA',number:'DEMO-1',cents:18000,quoteId:'demo-preventivo'});s.documents.push({id:'demo-documento',kind:'DICO',filename:'demo-metadati.pdf',mime:'application/pdf',bytes:128,clientId:'demo-cliente'})})}};
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();message('Modulo: '+(titles[tab]||'Strumenti'))}};
render();message('Ambiente di collaudo con dati locali. Per iniziare: Backup e strumenti → Carica dati sintetici.');
})();
</script></body></html>
